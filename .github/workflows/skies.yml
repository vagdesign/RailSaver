name: Fetch skies

# Downloads the photographic skies (Poly Haven, CC0) listed in tools/skies.json
# and stores them on the `sky-assets` branch, which the Build workflow uses.
on:
  push:
    paths: ['tools/skies.json', 'tools/fetch_skies.py', '.github/workflows/skies.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - name: Download
        run: python tools/fetch_skies.py skies --catalog
      - name: Store on the sky-assets branch
        run: |
          cd skies
          cat > README.md <<'MD'
          Photographic skies for RailSaver, from [Poly Haven](https://polyhaven.com/hdris) (CC0, public domain).
          Generated by `.github/workflows/skies.yml` from `tools/skies.json`. Do not edit by hand.
          MD
          git init -q -b sky-assets
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Skies from ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" sky-assets
